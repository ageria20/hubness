server {
    listen 80;
    root /usr/share/nginx/html;

    # Le risorse con hash nel nome non cambiano mai: cache lunga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single page app: ogni rotta (es. /invite/<token>) serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
